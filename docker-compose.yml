services:
  findmymovie:
    build: .
    image: findmymovie
    container_name: findmymovie
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
    environment:
      # Mettre à "false" pour jouer uniquement avec les répliques embarquées (hors ligne).
      WIKIQUOTE_ENABLED: "${WIKIQUOTE_ENABLED:-true}"
      # Mettre à "false" pour désactiver les comptes (le jeu fonctionne sans).
      ACCOUNTS_ENABLED: "${ACCOUNTS_ENABLED:-true}"
      # À mettre à "true" uniquement derrière un reverse proxy de confiance (nginx, Traefik…).
      TRUST_PROXY: "${TRUST_PROXY:-false}"
    volumes:
      - findmymovie-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  findmymovie-data:
