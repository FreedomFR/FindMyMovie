# FindMyMovie derrière nginx et Cloudflare.
#
#   visiteur ──► Cloudflare ──HTTPS──► nginx (ce fichier) ──HTTP──► FindMyMovie (127.0.0.1:9601)
#
# À copier dans /etc/nginx/conf.d/findmymovie.conf, puis adapter le nom de domaine et les chemins du
# certificat. Prérequis : /etc/nginx/cloudflare-realip.conf, généré par update-cloudflare-ips.sh.
# Côté FindMyMovie (fichier .env) : BIND_ADDRESS=127.0.0.1 et TRUST_PROXY=1.

upstream findmymovie {
    server 127.0.0.1:9601;
    keepalive 8;
}

server {
    listen 80;
    server_name findmymovie.exemple.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # listen [::]:443 ssl;    # à décommenter si le serveur a IPv6
    server_name findmymovie.exemple.fr;

    # Certificat d'origine Cloudflare (tableau de bord : SSL/TLS > Serveur d'origine > Créer un certificat)
    # ou certificat Let's Encrypt. Mode SSL/TLS de Cloudflare : « Complet (strict) ».
    ssl_certificate     /etc/ssl/cloudflare/findmymovie.pem;
    ssl_certificate_key /etc/ssl/cloudflare/findmymovie.key;

    # Cloudflare transmet l'adresse réelle du visiteur dans CF-Connecting-IP. nginx ne la croit que si
    # la connexion vient d'une adresse Cloudflare (liste officielle) : un visiteur qui contournerait
    # Cloudflare ne peut pas se faire passer pour quelqu'un d'autre.
    include /etc/nginx/cloudflare-realip.conf;

    # Les requêtes de l'appli sont minuscules (JSON de quelques lignes).
    client_max_body_size 16k;

    location / {
        proxy_pass http://findmymovie;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Indispensable : l'appli compare l'en-tête Origin à Host (protection CSRF).
        proxy_set_header Host $http_host;

        # L'adresse du visiteur est ÉCRASÉE (et non complétée) : ce que le visiteur a pu écrire dans
        # X-Forwarded-For n'arrive jamais jusqu'à l'appli.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }
}
